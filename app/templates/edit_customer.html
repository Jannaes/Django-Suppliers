{% extends 'index.html' %}


{% block content %}

<div class="card" style="width: 25rem;">
    <div class="card-header">

        <h5>Editing {{customer.companyname}}</h5>

        <div class="card-body">
            <form method="post" action="/edit-customer-post/{{customer.id}}/">

                 {%csrf_token %}  <!--Django vaatii CSRF tokenin POST-pyynnöissä, muuten pyyntö ei onnistu -->
                <div class="form-group">
                    <label>Company Name</label>
                    <input type="text" name="companyname" value="{{customer.companyname}}">
                </div>
                <div class="form-group">
                    <label>Contact Person</label>
                    <input type="text" name="contactname" value="{{customer.contactname}}">
                </div>
                <div class="form-group">
                    <label>Address</label>
                    <input type="text" name="address" value="{{customer.address}}">
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" name="phone" value="{{customer.phone}}">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" value="{{customer.email}}">
                </div>
                <div class="form-group">
                    <label>Country</label>
                    <input type="text" name="country" value="{{customer.country}}">
                </div>

                <input type="submit" value="Update" class="btn btn-success btn-sm">
                <input type="button" onclick="window.location.href='/customers'" id="hide-btn"
                    class="btn btn-secondary btn-sm" value="Cancel">
            </form>
        </div>
    </div>
</div>


{% endblock %}
